<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Performance Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Student Performance Predictor</h1>

        <form action="/predict" method="POST">
            <div class="mb-3">
                <label class="form-label">Study Hours Per Week</label>
                <input type="number" step="1" class="form-control" name="study_hours" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Attendance (%)</label>
                <input type="number" step="1" class="form-control" name="attendance" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Midterm Score</label>
                <input type="number" step="1" class="form-control" name="midterm" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Assignments Avg</label>
                <input type="number" step="1" class="form-control" name="assignments" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quizzes Avg</label>
                <input type="number" step="1" class="form-control" name="quizzes" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Participation Score</label>
                <input type="number" step="1" class="form-control" name="participation" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Projects Score</label>
                <input type="number" step="1" class="form-control" name="projects" required>
            </div>

            <button type="submit" class="btn btn-primary">Predict</button>
        </form>

        {% if prediction %}
        <div class="alert alert-info mt-4">
            <h4>Prediction Result</h4>
            <p><strong>Predicted Total Score:</strong> {{ score }}</p>
            <p><strong>Predicted Grade:</strong> {{ grade }}</p>
            <p><strong>Pass/Fail:</strong> {{ result }}</p>
            <p><strong>Risk Level:</strong> {{ risk }}</p>
        </div>
        {% endif %}

    </div>
</body>
</html>
